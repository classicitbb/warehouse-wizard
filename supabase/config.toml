project_id = "gxfvxmxplngvxdkpmxgw"

[functions]
  [functions.auth-email-hook]
    verify_jwt = false
  [functions.badge-login]
    verify_jwt = false
  [functions.invite-user]
    verify_jwt = false
  [functions.copilot]
    verify_jwt = true
  [functions.send-notification-email]
    verify_jwt = true
  [functions.handle-email-events]
    verify_jwt = false
  [functions.preview-transactional-email]
    verify_jwt = false
  [functions.push-notify]
    verify_jwt = true
  # Opened from an email client by someone who is not signed in, and often
  # prefetched by the mail provider. The random token is the only credential.
  [functions.email-unsubscribe]
    verify_jwt = false


[functions.copilot-transcribe]
enabled = true
verify_jwt = true

# Called server-to-server by a NetSuite SuiteScript, which has no Supabase
# session and cannot mint a JWT. The shared `netsuite_webhook_secret`, compared
# in constant time, is the only credential.
[functions.netsuite-webhook]
verify_jwt = false

# Drained on a schedule by .github/workflows/netsuite-queue.yml, which presents
# the scoped `netsuite_queue_runner_secret` rather than the service-role key.
# A service-role JWT is still accepted for manual invocation; the handler
# checks both itself.
[functions.process-netsuite-queue]
verify_jwt = false
