name: Android TWA — Build, Sign & Publish

# Builds the Warehouse Wizard Android wrapper (Bubblewrap TWA + boot
# auto-launch + self-hosted update system), signs it with the production
# keystore, and publishes the download page + APK + update-manifest.json
# to GitHub Pages via the native Actions deployment (Settings → Pages →
# Source: GitHub Actions). Nothing is committed back to the repo — the
# signed APK never enters git history.
#
# See android-twa/README.md for one-time setup (keystore, secrets, Pages
# config) before this workflow can succeed.

on:
  push:
    branches: [main]
    paths:
      - "android-twa/**"
      - ".github/workflows/android-build-deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # GitHub's ubuntu-latest runners preset ANDROID_HOME/ANDROID_SDK_ROOT
      # to their own bundled SDK (/usr/local/lib/android/sdk) regardless of
      # which actions run — that's the runner image's baseline, not
      # something android-actions/setup-android added. Bubblewrap manages
      # its own separate SDK install and Gradle refuses to build when both
      # an ambient and a Bubblewrap-owned SDK path are present at once
      # ("Several environment variables ... contain different paths to the
      # SDK"). Clearing these here removes the ambient runner default so
      # Bubblewrap's own ~/.bubblewrap/android_sdk is the only one Gradle sees.
      ANDROID_HOME: ""
      ANDROID_SDK_ROOT: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Keep Bubblewrap as the owner of the Android SDK only. We provide the
      # JDK from Actions because Bubblewrap 1.24.1 hardcodes an Adoptium
      # GitHub Releases tarball URL for JDK 17.0.11+9; when that download
      # returns non-tar content in CI, `bubblewrap update` fails early with
      # `TAR_BAD_ARCHIVE` before the Android build even starts. Using
      # setup-java removes that brittle network dependency without
      # reintroducing the runner-vs-Bubblewrap SDK path conflict this
      # workflow already avoids.

      - name: Set up Java 17 (runner-managed JDK only)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Node (for the Bubblewrap CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bubblewrap CLI
        run: |
          # Pinned for reproducibility. Bump deliberately — check
          # `npm view @bubblewrap/cli versions` before changing (verified
          # 1.24.1 is actually published as of 2026-07-09).
          npm install -g @bubblewrap/cli@1.24.1

      - name: Seed Bubblewrap config with the runner JDK path
        shell: bash
        run: |
          if [ -z "${JAVA_HOME:-}" ]; then
            echo "::error::actions/setup-java did not provide JAVA_HOME."
            exit 1
          fi
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME"
          }
          EOF

      - name: Decode signing keystore
        working-directory: android-twa
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. See android-twa/README.md section 2.3."
            exit 1
          fi
          mkdir -p build
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > build/android.keystore

      - name: Compute versionCode/versionName
        id: version
        working-directory: android-twa
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Output filename must be exactly `twa-manifest.json` — `bubblewrap
          # update`/`build` look for that literal name in their working
          # directory, they don't take an arbitrary manifest file path.
          if [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "::error::ANDROID_KEY_ALIAS secret is not set."
            exit 1
          fi
          python3 scripts/bump-version.py \
            --base twa-manifest.json \
            --out build/twa-manifest.json \
            --run-number "${{ github.run_number }}" \
            --signing-key-alias "$ANDROID_KEY_ALIAS"

      - name: bubblewrap update (generate Android project from twa-manifest.json)
        working-directory: android-twa/build
        run: |
          # IMPORTANT: `bubblewrap init --manifest <x>` expects <x> to be the
          # URL of the *web app* manifest (the PWA's manifest.json) — it
          # fetches and parses that live URL, then interactively derives a
          # twa-manifest.json from it. That is NOT what we want here: we
          # already have a hand-maintained, checked-in twa-manifest.json
          # (packageId, signing key, etc. all pinned), and `init` has no
          # flag to force a specific packageId, so its auto-derived default
          # wouldn't match the package our Java sources/assetlinks.json are
          # already written against.
          #
          # `bubblewrap update` is the documented command for the opposite
          # direction: it regenerates the Android project directly FROM an
          # existing twa-manifest.json, no live fetch, fully deterministic.
          # --skipVersionUpgrade preserves the versionCode/versionName we
          # just computed above instead of letting update bump them itself.
          yes | bubblewrap update --skipVersionUpgrade

      - name: Apply boot-launch + self-update overrides
        working-directory: android-twa
        run: |
          python3 scripts/splice-overrides.py \
            --project ./build \
            --overrides ./app-src-overrides \
            --package com.warehouse.wizard

      - name: Accept Android SDK licenses (Bubblewrap-managed SDK)
        run: |
          # Gradle's Android plugin auto-downloads whatever SDK components
          # the generated project's compileSdkVersion/buildToolsVersion
          # require (currently build-tools;35.0.0 + platforms;android-36),
          # separately from whatever bubblewrap's own SDK bootstrap already
          # installed/licensed (e.g. build-tools 34). That auto-download is
          # blocked unless the license hashes are already accepted, and
          # piping "yes" into bubblewrap's `update` step only answers ITS
          # interactive prompts (JDK/SDK install) — it never reaches the
          # separate sdkmanager license prompt that Gradle triggers later
          # during `:app:minifyReleaseWithR8`. Writing the well-known Google
          # SDK license hash files directly is the standard CI workaround.
          SDK_ROOT="$HOME/.bubblewrap/android_sdk"
          mkdir -p "$SDK_ROOT/licenses"
          {
            echo "8933bad161af4178b1185d1a37fbf41ea5269c55"
            echo "d56f5187479451eabf01fb78af6dfcb131a6481e"
            echo "24333f8a63b6825ea9c5514f83c2829b004d1fee"
          } > "$SDK_ROOT/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_ROOT/licenses/android-sdk-preview-license"

      - name: Validate signing keystore inputs
        working-directory: android-twa
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD secrets must all be set."
            exit 1
          fi
          # This catches the common failure modes before Bubblewrap reaches
          # apksigner: wrong keystore file, wrong alias, or a bad store password.
          keytool -list -v \
            -keystore build/android.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -keypass "$ANDROID_KEY_PASSWORD" >/dev/null

      - name: bubblewrap build (signed APK + AAB)
        working-directory: android-twa/build
        env:
          # Bubblewrap's `build` command reads these two exact env var names
          # to skip its interactive password prompts entirely — documented
          # specifically as "allows running build as part of a continuous
          # integration." Far more reliable than piping answers over stdin.
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$BUBBLEWRAP_KEYSTORE_PASSWORD" ] || [ -z "$BUBBLEWRAP_KEY_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_PASSWORD secrets are not set."
            exit 1
          fi
          bubblewrap build --skipPwaValidation

      - name: Stage the Pages site
        working-directory: android-twa
        run: |
          APK_SRC="build/app-release-signed.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "::error::Expected signed APK not found at $APK_SRC — check the bubblewrap build step log."
            exit 1
          fi

          # Start from the committed template (index.html + assets), then
          # drop in this run's freshly built APK + update-manifest.json.
          rm -rf build/pages-site
          cp -r site build/pages-site

          VERSIONED_NAME="warehouse-wizard-${{ steps.version.outputs.version_name }}.apk"
          cp "$APK_SRC" "build/pages-site/downloads/$VERSIONED_NAME"
          cp "$APK_SRC" "build/pages-site/downloads/warehouse-wizard-latest.apk"
          rm -f "build/pages-site/downloads/.gitkeep"

          python3 scripts/write-update-manifest.py \
            --out build/pages-site/update-manifest.json \
            --version-code "${{ steps.version.outputs.version_code }}" \
            --version-name "${{ steps.version.outputs.version_name }}" \
            --apk-path "downloads/warehouse-wizard-latest.apk"

      - name: Upload AAB artifact (for Play Store submission — not published to Pages)
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-wizard-${{ steps.version.outputs.version_name }}-aab
          path: android-twa/build/app-release-bundle.aab
          retention-days: 90
          if-no-files-found: warn

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: android-twa/build/pages-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
