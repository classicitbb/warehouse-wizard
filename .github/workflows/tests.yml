name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, unit tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Fails the job on ESLint errors only. Warnings (currently ~2.8k, mostly
      # unused imports copied between feature pages) are tracked debt, not a
      # gate — tighten with --max-warnings once that backlog is worked down.
      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Run test suite
        run: bun run test

      # The production bundle was previously never built in CI, so a build-only
      # break reached Vercel unverified.
      - name: Build
        run: bun run build
