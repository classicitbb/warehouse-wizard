name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, unit tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # npm, matching vercel.json and every script/doc in the repo, so CI and
      # production resolve the same dependency graph from the same lockfile.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails the job on ESLint errors only. Warnings (currently ~2.8k, mostly
      # unused imports copied between feature pages) are tracked debt, not a
      # gate — tighten with --max-warnings once that backlog is worked down.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run test suite
        run: npm run test

      # The production bundle was previously never built in CI, so a build-only
      # break reached Vercel unverified.
      - name: Build
        run: npm run build
